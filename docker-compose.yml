name: countic

# postgres + migrate + bot + web.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: countic
      POSTGRES_PASSWORD: ${COUNTIC_PG_PASSWORD:-countic}
      POSTGRES_DB: countic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countic -d countic"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: .
    command: ["npx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgres://countic:${COUNTIC_PG_PASSWORD:-countic}@postgres:5432/countic
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    command: ["node", "dist/bot/index.js"]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Overrides the host URL from .env, containers must use the compose hostname.
      DATABASE_URL: postgres://countic:${COUNTIC_PG_PASSWORD:-countic}@postgres:5432/countic
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: .
    command: ["node", "dist/web/index.js"]
    ports:
      # Only the public web port is published.
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # Overrides the host URL from .env, containers must use the compose hostname.
      DATABASE_URL: postgres://countic:${COUNTIC_PG_PASSWORD:-countic}@postgres:5432/countic
      WEB_PORT: 3000
      TRANSPORT_URL: http://bot:9103
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: 9101
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
